name: Finalize explanatory guides

on:
  push:
    branches:
      - release/explanatory-multilingual-guides

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: release/explanatory-multilingual-guides
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package lock version
        run: npm version 0.1.3 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Require clean dependency audit
        run: npm audit --audit-level=low

      - name: Run checks
        run: npm run check

      - name: Inspect package
        run: npm run package:check

      - name: Test exact tarball and installed skill
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n 1)"
          test "$TARBALL" = "opendiffs-0.1.3.tgz"
          npm exec --yes --package "./$TARBALL" -- opendiffs --help >/dev/null

          TEST_HOME="$(mktemp -d)"
          CODEX_HOME="$TEST_HOME/codex" \
          CLAUDE_CONFIG_DIR="$TEST_HOME/claude" \
          npm exec --yes --package "./$TARBALL" -- opendiffs install --agent all

          CODEX_SKILL="$TEST_HOME/codex/skills/opendiffs/SKILL.md"
          CLAUDE_SKILL="$TEST_HOME/claude/skills/opendiffs/SKILL.md"
          test -f "$CODEX_SKILL"
          test -f "$CLAUDE_SKILL"
          cmp "$CODEX_SKILL" "$CLAUDE_SKILL"
          grep -F "same natural language as the user's original task" "$CODEX_SKILL"
          grep -F "technically competent reader who is new to the repository" "$CODEX_SKILL"
          grep -F 'references` are evidence for the narrative, not a substitute for it' "$CODEX_SKILL"
          rm -rf "$TEST_HOME" "$TARBALL"

      - name: Commit synchronized lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-explanatory-guides.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/finalize-explanatory-guides.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize OpenDiffs 0.1.3 package metadata"
          git push origin HEAD:release/explanatory-multilingual-guides
