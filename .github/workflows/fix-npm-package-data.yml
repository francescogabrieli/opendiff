name: Fix npm package data isolation

on:
  push:
    branches:
      - fix/npm-package-data-leak

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/npm-package-data-leak
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply packaging hardening
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = '0.1.5';
          pkg.files = pkg.files.flatMap((entry) => entry === 'dist/' ? ['dist/index.html', 'dist/assets/'] : [entry]);
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const vitePath = 'vite.config.ts';
          let vite = fs.readFileSync(vitePath, 'utf8');
          if (!vite.includes('publicDir: false')) {
            vite = vite.replace('export default defineConfig({\n', 'export default defineConfig({\n  publicDir: false,\n');
          }
          fs.writeFileSync(vitePath, vite);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const marker = '## [0.1.4]';
          const entry = `## [0.1.5] - 2026-08-10\n\n### Fixed\n\n- Prevent local guided-review data from ever being copied into the production renderer or included in the npm package. Vite no longer copies the local \`public/\` directory, and npm now packages only \`dist/index.html\` and \`dist/assets/\` from the renderer build.\n- Added a release-time package isolation check using synthetic local review data so future packages fail validation if \`public/data\` or \`dist/data\` leaks into the tarball.\n\n`;
          if (!changelog.includes('## [0.1.5]')) {
            changelog = changelog.replace(marker, entry + marker);
          }
          fs.writeFileSync(changelogPath, changelog);

          for (const path of ['docs/NPM_RELEASE.md', 'README.md']) {
            if (!fs.existsSync(path)) continue;
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('opendiff-0.1.4.tgz', 'opendiff-0.1.5.tgz');
            text = text.replaceAll('opendiff@0.1.4', 'opendiff@0.1.5');
            text = text.replaceAll('version `0.1.4`', 'version `0.1.5`');
            text = text.replaceAll('Publish version `0.1.4`', 'Publish version `0.1.5`');
            fs.writeFileSync(path, text);
          }

          const bugPath = '.github/ISSUE_TEMPLATE/bug.yml';
          if (fs.existsSync(bugPath)) {
            let text = fs.readFileSync(bugPath, 'utf8');
            text = text.replace('placeholder: 0.1.4 or commit SHA', 'placeholder: 0.1.5 or commit SHA');
            fs.writeFileSync(bugPath, text);
          }
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Run checks
        run: |
          npm ci
          npm run check

      - name: Prove local review data cannot ship
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data dist/data
          printf '%s\n' '{"secret":"must-not-ship-from-public"}' > public/data/review.json
          printf '%s\n' '{"secret":"must-not-ship-from-dist"}' > dist/data/diff.json
          npm pack --json > npm-pack.json
          TARBALL="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('npm-pack.json', 'utf8');
          let parsed;
          for (let i = raw.indexOf('['); i >= 0; i = raw.indexOf('[', i + 1)) {
            try { parsed = JSON.parse(raw.slice(i)); break; } catch {}
          }
          if (!parsed?.[0]?.filename) throw new Error('npm pack output missing');
          const files = parsed[0].files.map((file) => file.path);
          const forbidden = files.filter((path) => path.startsWith('dist/data/') || path.startsWith('public/data/'));
          if (forbidden.length) throw new Error(`private review data would ship: ${forbidden.join(', ')}`);
          if (!files.includes('dist/index.html')) throw new Error('renderer index missing');
          if (!files.some((path) => path.startsWith('dist/assets/'))) throw new Error('renderer assets missing');
          process.stdout.write(parsed[0].filename);
          NODE
          )"
          test "$TARBALL" = "opendiff-0.1.5.tgz"
          npm exec --yes --package "./$TARBALL" -- opendiff --version | grep -F '0.1.5'
          rm -rf public/data dist/data "$TARBALL" npm-pack.json

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-npm-package-data.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent local review data from shipping to npm"
          git push origin HEAD:fix/npm-package-data-leak
