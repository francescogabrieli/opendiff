name: Normalize OpenDiffs naming

on:
  push:
    branches:
      - release/consistent-opendiffs-naming

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: release/consistent-opendiffs-naming
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Normalize product, runtime, and repository names
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path('.')

          # Remove the pre-release compatibility skill: no legacy public name ships.
          legacy_skill = root / 'skills' / 'agent-diffs'
          if legacy_skill.exists():
              shutil.rmtree(legacy_skill)

          # Rename binary documentation assets without changing their bytes.
          for old_name, new_name in (
              ('docs/opendiff-demo.gif', 'docs/opendiffs-demo.gif'),
              ('docs/opendiff-preview.jpg', 'docs/opendiffs-preview.jpg'),
          ):
              old = root / old_name
              new = root / new_name
              if old.exists():
                  old.rename(new)

          text_suffixes = {
              '.css', '.html', '.js', '.json', '.md', '.mjs', '.mts',
              '.ts', '.tsx', '.txt', '.yaml', '.yml'
          }
          excluded = {
              Path('package.json'),
              Path('package-lock.json'),
              Path('.github/workflows/normalize-opendiffs.yml'),
          }

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              relative = path.relative_to(root)
              if relative in excluded or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')

              # Remove explicit compatibility promises before the global rename.
              text = text.replace(
                  '\nThe legacy `agent-diffs` command remains available during the pre-1.0 transition.\n',
                  '\n',
              )
              text = text.replace(
                  'The legacy agent-diffs binary remains available during the\npre-1.0 transition.\n',
                  '',
              )

              text = text.replace('agent-diffs', 'opendiffs')
              text = re.sub(r'OpenDiff(?!s)', 'OpenDiffs', text)
              text = re.sub(r'opendiff(?!s)', 'opendiffs', text)
              text = text.replace('[0.1.0] - Unreleased', '[0.1.0] - 2026-08-05')
              path.write_text(text, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['name'] = 'opendiffs'
          package['homepage'] = 'https://github.com/francescogabrieli/OpenDiffs#readme'
          package['bugs'] = {'url': 'https://github.com/francescogabrieli/OpenDiffs/issues'}
          package['repository'] = {
              'type': 'git',
              'url': 'git+https://github.com/francescogabrieli/OpenDiffs.git',
          }
          package['bin'] = {'opendiffs': './cli/opendiffs.mjs'}
          package['scripts'].pop('agent-diffs', None)
          package['scripts']['opendiffs'] = 'node ./cli/opendiffs.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate npm lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run unit and type checks
        run: npm test

      - name: Build the bundled renderer
        run: npm run build

      - name: Inspect the publishable package
        run: npm run package:check

      - name: Commit the completed migration
        shell: bash
        run: |
          git rm .github/workflows/normalize-opendiffs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: standardize OpenDiffs naming"
          git push origin HEAD:release/consistent-opendiffs-naming
