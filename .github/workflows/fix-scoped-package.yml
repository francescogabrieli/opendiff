name: Validate scoped npm package

on:
  push:
    branches: [fix/npm-scoped-package]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npm-scoped-package
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
      - name: Apply scoped package changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['name'] = '@francescogabrieli/opendiff'
          data['version'] = '0.1.6'
          if 'bin/' not in data['files']:
              data['files'].insert(data['files'].index('cli/'), 'bin/')
          data['bin'] = {'opendiff': 'bin/opendiff.js'}
          p.write_text(json.dumps(data, indent=2) + '\n')

          replacements = {
              'npx --yes opendiff@latest': 'npx --yes @francescogabrieli/opendiff@latest',
              'npm install -g opendiff': 'npm install -g @francescogabrieli/opendiff',
          }
          for filename in ['README.md','docs/NPM_RELEASE.md','skills/opendiff/SKILL.md','cli/opendiff.mjs']:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''## 0.1.6\n\n### Changed\n\n- Publish OpenDiff under the npm scope `@francescogabrieli/opendiff` because npm rejects the unscoped `opendiff` name as too similar to an existing package.\n- Use a conventional `bin/opendiff.js` executable wrapper so npm preserves the `opendiff` command during publish normalization.\n- The canonical installer is now `npx --yes @francescogabrieli/opendiff@latest install`.\n\n'''
          if '## 0.1.6' not in text:
              marker = text.find('## 0.1.5')
              text = text[:marker] + entry + text[marker:] if marker >= 0 else entry + text
          changelog.write_text(text)
          PY
          mkdir -p bin
          cat > bin/opendiff.js <<'EOF'
          #!/usr/bin/env node
          import "../cli/opendiff.mjs";
          EOF
          chmod +x bin/opendiff.js
          npm install --package-lock-only --ignore-scripts
      - name: Run checks
        run: |
          npm ci
          npm run check
      - name: Verify npm publish normalization and executable
        shell: bash
        run: |
          set -o pipefail
          npm publish --dry-run --access=public 2>&1 | tee /tmp/npm-publish-dry-run.log
          if grep -Eqi 'invalid and removed|auto-corrected some errors|bin\[opendiff\].*removed' /tmp/npm-publish-dry-run.log; then
            echo 'npm publish normalization changed the bin field' >&2
            exit 1
          fi
          TARBALL=$(npm pack --silent)
          npm exec --yes --package "./$TARBALL" -- opendiff --help | grep -q 'OpenDiff'
          rm -f "$TARBALL"
      - name: Commit final fix
        shell: bash
        run: |
          git rm .github/workflows/fix-scoped-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json bin/opendiff.js README.md CHANGELOG.md docs/NPM_RELEASE.md skills/opendiff/SKILL.md cli/opendiff.mjs
          git commit -m 'Prepare scoped npm package'
          git push origin HEAD:fix/npm-scoped-package
