name: Finalize v0.1.2 security

on:
  push:
    branches:
      - release/finalize-v0.1.2-security

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve audit and bump release version
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm version 0.1.2 --no-git-tag-version

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!changelog.includes('## [0.1.2] - 2026-08-08')) {
            const marker = '## [0.1.1] - 2026-08-08';
            if (!changelog.includes(marker)) throw new Error('Expected 0.1.1 changelog marker not found');
            const release = `## [0.1.2] - 2026-08-08\n\n### Security\n\n- Updated the indirect development dependency \`nanoid\` to a non-vulnerable version, clearing the npm audit advisory before the public repository launch.\n\n`;
            changelog = changelog.replace(marker, `${release}${marker}`);
            fs.writeFileSync(changelogPath, changelog);
          }

          const npmReleasePath = 'docs/NPM_RELEASE.md';
          let npmRelease = fs.readFileSync(npmReleasePath, 'utf8').replaceAll('0.1.1', '0.1.2');
          npmRelease = npmRelease.replace(
            'The first npm-published version is `0.1.2`. GitHub `v0.1.0` was created during prepublish validation before the final README and repository-config changes, so it remains immutable rather than being rewritten.',
            'The first npm-published version is `0.1.2`. GitHub `v0.1.0` and `v0.1.1` were private prepublish validation releases; they remain immutable rather than being rewritten.'
          );
          fs.writeFileSync(npmReleasePath, npmRelease);

          const bugPath = '.github/ISSUE_TEMPLATE/bug.yml';
          const bug = fs.readFileSync(bugPath, 'utf8').replace('placeholder: 0.1.1 or commit SHA', 'placeholder: 0.1.2 or commit SHA');
          fs.writeFileSync(bugPath, bug);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Require a clean full audit
        run: npm audit --audit-level=low

      - name: Run checks
        run: npm run check

      - name: Build and test exact tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          test -f opendiffs-0.1.2.tgz
          npm exec --yes --package ./opendiffs-0.1.2.tgz -- opendiffs --help
          TEST_HOME="$(mktemp -d)"
          CODEX_HOME="$TEST_HOME/codex" \
          CLAUDE_CONFIG_DIR="$TEST_HOME/claude" \
          npm exec --yes --package ./opendiffs-0.1.2.tgz -- opendiffs install --agent all
          test -f "$TEST_HOME/codex/skills/opendiffs/SKILL.md"
          test -f "$TEST_HOME/claude/skills/opendiffs/SKILL.md"
          rm -rf "$TEST_HOME" opendiffs-0.1.2.tgz

      - name: Verify final state
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --print "require('./package.json').version")" = "0.1.2"
          test "$(node --print "require('./package-lock.json').version")" = "0.1.2"
          test "$(node --print "require('./package-lock.json').packages[''].version")" = "0.1.2"
          test -f .opendiffs/config.json
          test ! -e .agent-diffs
          npm audit --omit=dev --audit-level=low

      - name: Remove temporary workflow and commit final state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v012-security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f .opendiffs/config.json
          git status --short
          git commit -m 'Finalize OpenDiffs 0.1.2 security release'
          git push origin HEAD:release/finalize-v0.1.2-security
