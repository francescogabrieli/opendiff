name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, publish, and create release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js for Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use a Trusted Publishing-compatible npm CLI
        run: npm install --global npm@11

      - name: Validate tag, package version, and changelog
        id: version
        shell: bash
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          PACKAGE="$(node --print "require('./package.json').name")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Retag as v$VERSION."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not an ancestor of origin/main, so $TAG points at work that never reached main. Merge the release branch into main, then move the tag onto the merged commit. Run 'npm run release:preflight' locally to catch this before tagging."
            exit 1
          fi
          VERSION="$VERSION" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.VERSION;
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const match = new RegExp(`^## \\[${escaped}\\](?: - .+)?$`, 'm').exec(changelog);
          if (!match) throw new Error(`CHANGELOG.md has no section for ${version}`);

          const remainder = changelog.slice(match.index + match[0].length);
          const nextHeader = remainder.search(/^## /m);
          const notes = (nextHeader === -1 ? remainder : remainder.slice(0, nextHeader)).trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty`);
          fs.writeFileSync('release-notes.md', `${notes}\n`);
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Run checks
        run: npm run check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build and inspect the exact tarball
        id: package
        shell: bash
        run: |
          npm pack --json > npm-pack.log
          TARBALL="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const output = fs.readFileSync('npm-pack.log', 'utf8');
          let result = null;
          for (let index = output.indexOf('['); index !== -1; index = output.indexOf('[', index + 1)) {
            try {
              const candidate = JSON.parse(output.slice(index));
              if (Array.isArray(candidate) && candidate[0]?.filename) {
                result = candidate;
                break;
              }
            } catch {
              // Prepack logs can precede npm's final JSON payload.
            }
          }
          if (!result) throw new Error('Could not locate npm pack JSON output');
          process.stdout.write(result[0].filename);
          NODE
          )"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          npm exec --yes --package "./$TARBALL" -- opendiff --help

      - name: Test isolated skill installation
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          TEST_ROOT="$(mktemp -d)"
          CODEX_HOME="$TEST_ROOT/codex" \
          CLAUDE_CONFIG_DIR="$TEST_ROOT/claude" \
          npm exec --yes --package "./$TARBALL" -- opendiff install --agent all
          test -f "$TEST_ROOT/codex/skills/opendiff/SKILL.md"
          test -f "$TEST_ROOT/claude/skills/opendiff/SKILL.md"

      - name: Smoke test the published tarball in a bare repository
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          # Level 0 has to work with no skill installed, no agent, and no
          # .opendiff/review.json — this is the first-run path for new users.
          PACKED="$PWD/$TARBALL"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          git init -q .
          git config user.email smoke@example.com
          git config user.name "OpenDiff smoke"
          printf 'export const value = 1;\n' > value.ts
          git add -A
          git commit -qm base
          printf 'export const value = 2;\nexport const added = true;\n' > value.ts

          npm exec --yes --package "$PACKED" -- opendiff share --output smoke.html
          test -s smoke.html
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("smoke.html", "utf8");
            const match = html.match(/<script id="opendiff-data" type="application\/json">([\s\S]*?)<\/script>/);
            if (!match) throw new Error("shared file has no embedded payload");
            const payload = JSON.parse(match[1]);
            if (payload.mode !== "diff-only") throw new Error("expected a diff-only payload");
            if (!payload.diff.files.some((file) => file.path === "value.ts")) throw new Error("shared payload is missing the change");
            const external = [...html.matchAll(/(?:src|href)="(\/[^"]*)"/g)];
            if (external.length) throw new Error("shared file is not self-contained: " + external.map((m) => m[1]).join(", "));
          '

      - name: Check registry state
        id: registry
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_GIT_HEAD="$(npm view "$PACKAGE@$VERSION" gitHead)"
            test "$PUBLISHED_GIT_HEAD" = "$GITHUB_SHA"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with OIDC provenance
        if: steps.registry.outputs.published != 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "./$TARBALL" --access public

      - name: Verify registry version and provenance
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          test "$(npm view "$PACKAGE@$VERSION" version)" = "$VERSION"
          npm view "$PACKAGE@$VERSION" dist.attestations --json > npm-attestations.json
          test -s npm-attestations.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const attestations = JSON.parse(fs.readFileSync('npm-attestations.json', 'utf8'));
          if (!attestations || typeof attestations !== 'object') {
            throw new Error('npm did not return provenance attestations');
          }
          NODE

      - name: Create or repair the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "OpenDiff $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --verify-tag \
              --title "OpenDiff $TAG" \
              --notes-file release-notes.md
          fi
