name: Normalize OpenDiff links

on:
  push:
    branches:
      - rename/opendiff

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rename/opendiff
      - name: Normalize canonical repository paths
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/*) continue ;;
            esac
            perl -0pi -e 's#francescogabrieli/OpenDiff#francescogabrieli/opendiff#g; s#cd OpenDiff#cd opendiff#g' "$file"
          done < <(git grep -Ilz -e 'francescogabrieli/OpenDiff' -e 'cd OpenDiff' || true)
          if git grep -nF 'francescogabrieli/OpenDiff' -- . ':!.github/workflows/*'; then
            exit 1
          fi
          if git grep -nF 'cd OpenDiff' -- . ':!.github/workflows/*'; then
            exit 1
          fi
      - name: Commit normalization and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-opendiff-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize OpenDiff repository links"
          git push origin HEAD:rename/opendiff
