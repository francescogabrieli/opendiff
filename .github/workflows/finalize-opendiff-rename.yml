name: Finalize OpenDiff rename

on:
  push:
    branches:
      - rename/opendiff

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: rename/opendiff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rename tracked paths
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            new_path="${path//opendiffs/opendiff}"
            if [ "$path" != "$new_path" ]; then
              mkdir -p "$(dirname "$new_path")"
              git mv "$path" "$new_path"
            fi
          done < <(git ls-files -z | grep -z 'opendiffs' || true)

      - name: Rename product references
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            perl -0pi -e 's/OpenDiffs/OpenDiff/g; s/OPENDIFFS/OPENDIFF/g; s/opendiffs/opendiff/g' "$file"
          done < <(git grep -Ilz -e 'OpenDiffs' -e 'OPENDIFFS' -e 'opendiffs' || true)

      - name: Bump package version and changelog
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.1.4 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [0.1.3]'
          entry = '''## [0.1.4] - 2026-08-10\n\n### Changed\n\n- Renamed the product from OpenDiff to OpenDiff across the repository, npm package, CLI, skill, generated review directory, documentation, schemas, tests, and release metadata.\n- The canonical public install command is now `npx --yes opendiff@latest install`, the agent skill is `@opendiff`, and generated review state lives under `.opendiff/`.\n\n'''
          if marker not in text:
              raise SystemExit('CHANGELOG marker not found')
          path.write_text(text.replace(marker, entry + marker, 1))
          PY
          sed -i 's/opendiff@0\.1\.3/opendiff@0.1.4/g; s/opendiff-0\.1\.3/opendiff-0.1.4/g; s/v0\.1\.3/v0.1.4/g' docs/NPM_RELEASE.md docs/RELEASING.md README.md 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Require clean audit
        run: npm audit --audit-level=low

      - name: Run checks
        run: npm run check

      - name: Run browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Inspect package
        run: npm run package:check

      - name: Test exact tarball and installed skill
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n 1)"
          test "$TARBALL" = "opendiff-0.1.4.tgz"
          npm exec --yes --package "./$TARBALL" -- opendiff --help >/dev/null
          npm exec --yes --package "./$TARBALL" -- opendiff --version | grep -F '0.1.4'

          TEST_HOME="$(mktemp -d)"
          CODEX_HOME="$TEST_HOME/codex" \
          CLAUDE_CONFIG_DIR="$TEST_HOME/claude" \
          npm exec --yes --package "./$TARBALL" -- opendiff install --agent all

          CODEX_SKILL="$TEST_HOME/codex/skills/opendiff/SKILL.md"
          CLAUDE_SKILL="$TEST_HOME/claude/skills/opendiff/SKILL.md"
          test -f "$CODEX_SKILL"
          test -f "$CLAUDE_SKILL"
          cmp "$CODEX_SKILL" "$CLAUDE_SKILL"
          grep -F 'npx --yes opendiff@latest review' "$CODEX_SKILL"
          grep -F '.opendiff/review.json' "$CODEX_SKILL"

          rm -rf "$TEST_HOME" "$TARBALL"

      - name: Reject legacy plural naming
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi 'opendiffs' -- . ':!package-lock.json'; then
            echo 'Legacy plural naming remains in tracked text.' >&2
            exit 1
          fi
          if git ls-files | grep -Ei 'opendiffs'; then
            echo 'Legacy plural naming remains in a tracked path.' >&2
            exit 1
          fi
          test -f cli/opendiff.mjs
          test -f skills/opendiff/SKILL.md
          test -f .opendiff/config.json
          node -e "const p=require('./package.json'); if(p.name!=='opendiff'||p.version!=='0.1.4'||p.bin.opendiff!=='./cli/opendiff.mjs') process.exit(1)"

      - name: Commit finalized rename and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-opendiff-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename OpenDiffs to OpenDiff"
          git push origin HEAD:rename/opendiff
